<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Employee</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f3f6fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      padding: 40px 50px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #d9534f;
      font-size: 24px;
      margin-bottom: 20px;
    }

    p {
      font-size: 16px;
      margin-bottom: 25px;
      color: #555;
    }

    p strong {
      color: #222;
    }

    form {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .confirm, .cancel {
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      font-weight: 500;
    }

    .confirm {
      background: #dc3545;
      color: #fff;
    }

    .confirm:hover {
      background: #b52b38;
    }

    .cancel {
      background: #e5e7eb;
      color: #333;
    }

    .cancel:hover {
      background: #d5d7db;
    }

    .warning-icon {
      font-size: 50px;
      color: #dc3545;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="warning-icon">⚠️</div>

    <h2>Are you sure you want to delete this employee?</h2>

    <p>
      <strong>{{ employee.first_name }}</strong><br>
      {{ employee.email }}
    </p>

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="employee_id" value="{{ employee.id }}">

      <button type="submit" class="confirm">Yes, Delete</button>
      <a href="/employee_list/" class="cancel">Cancel</a>
    </form>
  </div>

</body>
</html>
