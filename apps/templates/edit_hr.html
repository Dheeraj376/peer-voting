<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Employee</title>

<style>
  body{
    margin:0;
    font-family:Poppins, sans-serif;
    background:#f3f4f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#333;
  }

  .container{
    width:420px;
    background:#ffffff;
    padding:25px 30px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
  }

  h2{
    margin:0 0 15px;
    text-align:center;
    font-size:24px;
    font-weight:600;
  }

  .back-btn{
    text-decoration:none;
    color:#4f46e5;
    font-weight:600;
    font-size:14px;
  }

  .logout-btn{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }

  label{
    font-size:14px;
    font-weight:500;
    margin-bottom:6px;
    display:block;
  }

  input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    font-size:15px;
  }

  .btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#4f46e5;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:16px;
  }

  .btn:hover{
    background:#4338ca;
  }

  .alert{
    padding:10px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:14px;
  }

  .alert-error{background:#fee2e2;color:#b91c1c}
  .alert-success{background:#dcfce7;color:#166534}
</style>
</head>
<body>

<div class="container">

  <!-- ✅ TOP BAR -->
  <div class="top-bar">
    <a href="/admin_dashboard/" class="back-btn">← Back</a>

    <form method="POST" action="/logout/" style="margin:0;">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Logout</button>
    </form>
  </div>

  <h2>Edit Employee</h2>

  <!-- ✅ DJANGO MESSAGES -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert 
        {% if message.tags == 'error' %}alert-error
        {% else %}alert-success
        {% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <!-- ✅ EDIT FORM -->
  <form method="POST">
    {% csrf_token %}

    <label>First Name</label>
    <input type="text" name="first_name" value="{{ emp.first_name }}" required />

    <label>Username</label>
    <input type="text" name="username" value="{{ emp.username }}" required />

    <label>Email</label>
    <input type="email" name="email" value="{{ emp.email }}" required />

    <label>Password</label>
    <input type="password" name="password" placeholder="Leave blank to keep current password" />

    <button class="btn" type="submit">Update</button>
  </form>

</div>

</body>
</html>
