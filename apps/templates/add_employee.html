<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Employee</title>

<style>
  body{
    margin:0;
    font-family:Poppins, sans-serif;
    background:linear-gradient(135deg,#eef1f6,#dce3f3);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#333;
    padding:20px;
  }

  .container{
    width:420px;
    background:#ffffff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    animation:pop 0.4s ease;
    border:1px solid #e5e7eb;
  }

  @keyframes pop{
    from{transform:scale(.92);opacity:0}
    to{transform:scale(1);opacity:1}
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
  }

  h2{
    margin:0 0 20px;
    text-align:center;
    font-size:26px;
    font-weight:600;
    color:#1f2937;
  }

  .back-btn{
    text-decoration:none;
    color:#4f46e5;
    font-weight:600;
    font-size:14px;
    transition:0.2s;
  }
  .back-btn:hover{
    color:#3730a3;
    transform:translateX(-4px);
  }

  .logout-btn{
    background:#ef4444;
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }

  label{
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
    display:block;
    color:#374151;
  }

  input{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    margin-bottom:18px;
    font-size:15px;
    background:#f9fafb;
    transition:0.25s;
  }
  input:focus{
    border-color:#6366f1;
    background:#fff;
    box-shadow:0 0 6px rgba(99,102,241,.3);
    outline:none;
  }

  .btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#4f46e5,#6366f1);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
  }
  .btn:hover{
    background:linear-gradient(90deg,#4338ca,#4f46e5);
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(79,70,229,.35);
  }

  .alert{
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    font-size:14px;
    animation:fadeIn 0.4s ease;
  }

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(-4px)}
    to{opacity:1;transform:translateY(0)}
  }

  .alert-error{
    background:#fee2e2;
    color:#b91c1c;
    border:1px solid #fca5a5;
  }
  .alert-success{
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
  }
  .alert-info{
    background:#e5e7eb;
    color:#1f2937;
    border:1px solid #d1d5db;
  }
</style>
</head>

<body>

<div class="container">


  <!-- ✅ TOP BAR -->
  <div class="top-bar">
    

    <form method="POST" action="/logout/" style="margin:0;">
      {% csrf_token %}
      <button type="submit" class="logout-btn">Logout</button>
    </form>

        
    {% if request.user.role == 1 %}<br>
        <a href="/admin_dashboard/" class="btn-back">Back to Dashboard</a>
    
    {% elif request.user.role == 2 %}<br>
        <a href="/hr_dashboard/?month={{current_month}}#monthly-summary/"btn-back">Back to Dashboard</a>
    {% endif %}
  </div>

  <h2>Add New Employee</h2>

  <!-- ✅ DJANGO MESSAGES -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert
        {% if message.tags == 'error' %}alert-error
        {% elif message.tags == 'success' %}alert-success
        {% else %}alert-info
        {% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <!-- ✅ ADD FORM -->
  <form method="POST">
    {% csrf_token %}

    <label>First Name</label>
    <input type="text" name="first_name" required />

    <label>Username</label>
    <input type="text" name="username" required />

    <label>Email</label>
    <input type="email" name="email" required />

    <label>Password</label>
    <input type="password" name="password" required />

    <button class="btn" type="submit">Submit</button>
  </form>

</div>

</body>
</html>
